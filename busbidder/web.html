<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusBidder Spain</title>
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --line: #d9dde5; --bg: #f6f7f9; --card: #fff; --accent: #1f5fbf; --bad: #b42318; --good: #157347; --warn-bg: #fff4e5; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 1; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  nav ul { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
  nav a { display: block; padding: 4px 10px; border-radius: 6px; color: var(--accent); text-decoration: none; }
  nav a:hover, nav a:focus-visible { background: #eef4fd; }
  nav a[aria-disabled="true"] { color: var(--muted); pointer-events: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 16px; }
  section { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; scroll-margin-top: 70px; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; align-items: end; }
  .field { display: grid; gap: 3px; }
  .field.wide { grid-column: 1 / -1; }
  .field.name { max-width: 280px; margin-bottom: 4px; }
  label { font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.small { padding: 3px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .lines { margin: 0 0 12px; padding-left: 18px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; vertical-align: bottom; }
  th.group { text-align: center; border-bottom: 1px solid var(--muted); }
  td.n, th.n { text-align: right; }
  tr.top td { background: #eef4fd; }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 12px 0 0; font: 13.5px/1.45 ui-monospace, Consolas, monospace; }
  .msg { margin: 10px 0 0; font-weight: 600; }
  .msg:empty { display: none; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
  .banner { background: var(--warn-bg); border: 1px solid #f0c27b; border-radius: 8px; padding: 12px 16px; }
  .banner code { background: #fff; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>BusBidder Spain</h1>
  <nav aria-label="Sections">
    <ul>
      <li><a href="#request">Travel request</a></li>
      <li><a href="#results" id="nav-results" aria-disabled="true">Ranking</a></li>
      <li><a href="#bookings">Bookings</a></li>
    </ul>
  </nav>
</header>
<main>
  <div class="banner" id="offline" role="alert" hidden>
    This page needs the BusBidder server. In the <code>implementation</code> folder run
    <code>uv run python -m busbidder web</code>, then open <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a>.
  </div>

  <section id="request" aria-labelledby="request-title">
    <h2 id="request-title">Travel request</h2>
    <p class="hint" id="mode-note" role="status"></p>
    <form id="form">
      <div class="field"><label for="profile">Traveller profile</label><select name="profile" id="profile" required></select></div>
      <div class="field"><label for="destination">Destination</label><select name="destination" id="destination" required></select></div>
      <div class="field"><label for="date_from">First travel date</label><input type="date" name="date_from" id="date_from" required></div>
      <div class="field"><label for="date_to">Last travel date</label><input type="date" name="date_to" id="date_to" required></div>
      <div class="field"><label for="budget">Maximum price (EUR)</label><input type="number" name="budget" id="budget" min="0" step="0.01" placeholder="no limit"></div>
      <div class="field"><label for="passengers">Passengers</label><input type="number" name="passengers" id="passengers" min="1" step="1" required></div>
      <div class="field"><label for="departure">Preferred departure</label><input name="departure" id="departure" placeholder="09:00 or morning" required></div>
      <div class="field wide"><label for="weights">Weights in % (price, duration, departure, flexibility, transfers, rating, co2)</label>
        <input name="weights" id="weights" placeholder="price=40,duration=25,departure=15,flexibility=20" required></div>
      <button type="submit" id="rank-btn">Rank offers</button>
    </form>
    <p class="hint" id="profile-info"></p>
    <p class="msg err" id="form-error" role="alert"></p>
  </section>

  <section id="results" aria-labelledby="results-title" hidden>
    <h2 id="results-title">Ranking</h2>
    <ul class="lines" id="summary"></ul>
    <div class="field name"><label for="name">Traveller name (needed to book)</label><input id="name" autocomplete="name"></div>
    <p class="msg" id="book-msg" role="status"></p>
    <div class="scroll"><table id="table" aria-describedby="results-title"></table></div>
    <pre id="explanation" aria-label="Why the first offer ranks first"></pre>
  </section>

  <section id="bookings" aria-labelledby="bookings-title">
    <h2 id="bookings-title">Bookings</h2>
    <div class="scroll"><table id="bookings-table"></table></div>
  </section>
</main>
<script>
// Server text is inserted with textContent, never innerHTML: names and reasons come from users and files.
const $ = id => document.getElementById(id);
const SERVED = location.protocol === "http:" || location.protocol === "https:";
const LABELS = { price: "Price score", duration: "Duration score", departure: "Departure score", flexibility: "Flexibility score",
                 transfers: "Transfers score", rating: "Rating score", co2: "CO2 score" };
let meta, lastRequest;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function row(cells, header) {
  const tr = el("tr");
  cells.forEach(([t, cls, span]) => { const c = el(header ? "th" : "td", t, cls); if (header) c.scope = "col"; if (span) c.colSpan = span; tr.append(c); });
  return tr;
}
function showOffline() { $("offline").hidden = false; $("rank-btn").disabled = true; }

// Static hosting (GitHub Pages) has no Python server, so the same busbidder package runs in the browser with Pyodide.
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/";
const SOURCES = ["busbidder/__init__.py", "busbidder/booking.py", "busbidder/cli.py", "busbidder/constraints.py",
  "busbidder/errors.py", "busbidder/loader.py", "busbidder/models.py", "busbidder/scoring.py", "busbidder/web.py",
  "data/companies.csv", "data/destinations.csv", "data/offers.csv", "config/profiles.json"];
const ROOT = "/home/pyodide/bb", STORE_KEY = "busbidder-bookings";
let py = null;

function storage(fn) { try { return fn(localStorage); } catch { return null; } }  // blocked storage must not break the app

async function startInBrowser() {
  $("mode-note").textContent = "Loading the program into your browser (about 10 MB the first time)...";
  await new Promise((ok, fail) => { const s = el("script"); s.src = PYODIDE + "pyodide.js"; s.onload = ok; s.onerror = () => fail(new Error("Could not load Pyodide")); document.head.append(s); });
  py = await loadPyodide({ indexURL: PYODIDE });
  for (const dir of ["busbidder", "data", "config", "output"]) py.FS.mkdirTree(`${ROOT}/${dir}`);
  for (const f of SOURCES) {
    const res = await fetch(new URL("../" + f, location.href));
    if (!res.ok) throw new Error(`Could not load ${f} (${res.status})`);
    py.FS.writeFile(`${ROOT}/${f}`, await res.text());
  }
  const saved = storage(s => s.getItem(STORE_KEY));
  if (saved) py.FS.writeFile(`${ROOT}/output/bookings.json`, saved);
  const boot = `
import sys, json
sys.path.insert(0, "${ROOT}")
from pathlib import Path
from busbidder.cli import App
from busbidder.web import respond
app = App(Path("${ROOT}/output"))
def call(path, body):
    return json.dumps(respond(app, path, None if body is None else json.loads(body)))
`;
  try { py.runPython(boot); }
  catch (e) {  // a damaged saved bookings list must not lock the user out
    if (!saved) throw e;
    storage(s => s.removeItem(STORE_KEY)); py.FS.unlink(`${ROOT}/output/bookings.json`); py.runPython(boot);
  }
  $("mode-note").textContent = "Running in your browser. Bookings are saved in this browser only.";
}

function localCall(path, body) {
  const [status, data] = JSON.parse(py.globals.get("call")(path, body === undefined ? null : JSON.stringify(body)));
  if (status !== 200) throw new Error(data.error);
  if (path === "/api/book") storage(s => s.setItem(STORE_KEY, py.FS.readFile(`${ROOT}/output/bookings.json`, { encoding: "utf8" })));
  return data;
}

async function api(path, body) {
  if (py) return localCall(path, body);
  let res;
  try {
    res = await fetch(new URL(path, location.origin), body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  } catch {
    showOffline();
    throw new Error("Cannot reach the BusBidder server. Is it still running?");
  }
  const data = await res.json().catch(() => ({ error: `Unexpected reply from the server (${res.status})` }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fillProfile() {
  const p = meta.profiles[$("profile").value];
  $("destination").value = p.destination;
  $("date_from").value = p.date_from;
  $("date_to").value = p.date_to;
  $("budget").value = p.budget ?? "";
  $("passengers").value = p.passengers;
  $("departure").value = p.departure;
  $("weights").value = p.weights;
  $("profile-info").textContent = p.description + ". The fields show this profile's settings; change any of them for one run.";
}

async function loadBookings() {
  const list = await api("/api/bookings");
  const t = $("bookings-table"); t.replaceChildren();
  if (!list.length) { t.append(row([["No bookings yet."]])); return; }
  t.append(row([["Reference"], ["Traveller"], ["Offer"], ["Company"], ["Departs"], ["Passengers", "n"], ["Total (EUR)", "n"], ["Fare"], ["Payment"]], true));
  list.forEach(b => t.append(row([[b.reference], [b.traveller], [b.offer_id], [b.company], [b.departure], [b.passengers, "n"],
    [b.total_price.toFixed(2), "n"], [[b.fare.changeable && "changeable", b.fare.refundable && "refundable"].filter(Boolean).join("+") || "fixed"], [b.payment_status]])));
}

async function rank(body, scroll) {
  $("form-error").textContent = "";
  let r;
  try { r = await api("/api/rank", body); } catch (e) { $("form-error").textContent = e.message; $("request").scrollIntoView(); return; }
  lastRequest = body;
  $("results").hidden = false;
  $("nav-results").removeAttribute("aria-disabled");
  $("summary").replaceChildren(
    el("li", "Hard constraints: " + r.hard.join("; ")),
    el("li", "Soft preferences: " + r.soft.join(", ")),
    el("li", "Offers on this route and dates removed by: " + (r.removed.join(", ") || "nothing")),
    el("li", `${r.offers.length} acceptable offer(s), best first.`));
  const t = $("table"); t.replaceChildren();
  if (r.offers.length) {
    t.append(row([["", "", 9], ["Criterion scores (0 to 100)", "group", r.criteria.length + 1], [""]], true));
    t.append(row([["Rank", "n"], ["Offer"], ["Company"], ["Departs"], ["Duration", "n"], ["Price (EUR)", "n"], ["Transfers", "n"], ["Fare"], ["Free seats", "n"],
      ...r.criteria.map(c => [LABELS[c] || c, "n"]), ["Total", "n"], ["Book"]], true));
  }
  r.offers.forEach(o => {
    const tr = row([[o.rank, "n"], [o.offer_id], [o.company], [o.departure], [o.duration, "n"], [o.price, "n"], [o.transfers, "n"], [o.fare], [o.seats, "n"],
      ...o.scores.map(v => [v.toFixed(1), "n"]), [o.total.toFixed(1), "n"]]);
    if (o.rank === 1) tr.className = "top";
    const b = el("button", "Book", "small"); b.type = "button";
    b.setAttribute("aria-label", `Book ${o.offer_id} (${o.company}, ${o.departure}) for ${r.passengers} passenger(s)`);
    b.onclick = () => bookOffer(o.offer_id, r.passengers);
    const td = el("td"); td.append(b); tr.append(td); t.append(tr);
  });
  $("explanation").textContent = r.explanation;
  if (scroll) $("results").scrollIntoView();
}

async function bookOffer(offerId, passengers) {
  const m = $("book-msg"); m.className = "msg"; m.textContent = "";
  if (!$("name").value.trim()) { m.className = "msg err"; m.textContent = "Enter the traveller name first."; $("name").focus(); return; }
  try {
    const b = await api("/api/book", { offer_id: offerId, name: $("name").value, passengers });
    await loadBookings();
    await rank(lastRequest, false);  // refresh free seats
    m.className = "msg ok";
    m.textContent = `Booking confirmed: ${b.reference}. ${b.traveller}, ${b.passengers} passenger(s) on ${b.company}, departs ${b.departure}, total EUR ${b.total_price.toFixed(2)} (payment ${b.payment_status}).`;
  } catch (e) { m.className = "msg err"; m.textContent = e.message; }
}

$("form").onsubmit = e => { e.preventDefault(); rank(Object.fromEntries(new FormData(e.target)), true); };
$("profile").onchange = fillProfile;

(async () => {
  if (!SERVED) return showOffline();
  const probe = await fetch(new URL("/api/meta", location.origin)).catch(() => null);
  try {
    if (!probe || !probe.ok || !(probe.headers.get("Content-Type") || "").includes("json")) await startInBrowser();
    meta = await api("/api/meta");
  } catch (e) { $("mode-note").textContent = ""; $("form-error").textContent = e.message; $("rank-btn").disabled = true; return; }
  Object.keys(meta.profiles).forEach(n => $("profile").append(el("option", n)));
  meta.destinations.forEach(d => $("destination").append(el("option", d)));
  fillProfile();
  await loadBookings();
})();
</script>
</body>
</html>
